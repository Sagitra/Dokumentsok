<!doctype html>
<html lang="sv">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Dokumentsök</title>
        <style>
            :root {
                color-scheme: light;
                --lu-blue: #000080;
                --lu-bronze: #9c6114;
                --lu-light-blue: #b9d3dc;
                --lu-green: #adcab8;
                --lu-beige: #d6d2c4;
                --lu-grey: #bfb8af;
                --lu-pink: #e9c4c7;
                --bg: #f7f5ef;
                --panel: #ffffff;
                --ink: #111129;
                --muted: #5c5a55;
                --line: #d8d2c5;
                --accent: var(--lu-blue);
                --accent-soft: #e9f1f4;
                --focus: var(--lu-bronze);
                --shadow: 0 12px 34px rgba(17, 17, 41, 0.11);
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                overflow: hidden;
            }

            body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font-family: Arial, Helvetica, sans-serif;
                letter-spacing: 0;
            }

            a {
                color: inherit;
            }

            [hidden] {
                display: none !important;
            }

            .app {
                display: grid;
                grid-template-columns: minmax(330px, 440px) minmax(520px, 1fr);
                height: 100vh;
                min-height: 0;
                overflow: hidden;
            }

            .sidebar {
                display: flex;
                flex-direction: column;
                height: 100vh;
                min-height: 0;
                overflow: hidden;
                border-right: 1px solid var(--line);
                background: #f2efe6;
            }

            .header {
                padding: 22px 22px 16px;
                border-bottom: 1px solid var(--line);
                background: #fff;
            }

            .header h1 {
                margin: 0 0 6px;
                color: var(--lu-blue);
                font-size: 1.5rem;
                line-height: 1.2;
            }

            .header p {
                margin: 0;
                color: var(--muted);
                font-size: 0.95rem;
                line-height: 1.45;
            }

            .search-row {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-top: 16px;
            }

            .search-wrap {
                position: relative;
                flex: 1 1 auto;
                min-width: 0;
            }

            .search-icon {
                position: absolute;
                left: 12px;
                top: 50%;
                width: 18px;
                height: 18px;
                transform: translateY(-50%);
                color: var(--muted);
                pointer-events: none;
            }

            #search {
                width: 100%;
                min-height: 44px;
                padding: 10px 12px 10px 40px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: #fff;
                color: var(--ink);
                font-size: 1rem;
                outline: none;
            }

            #search:focus {
                border-color: var(--focus);
                box-shadow: 0 0 0 3px rgba(156, 97, 20, 0.18);
            }

            .stats {
                display: flex;
                gap: 8px;
                align-items: center;
                justify-content: space-between;
                margin-top: 12px;
                color: var(--muted);
                font-size: 0.86rem;
            }

            .index-status {
                overflow-wrap: anywhere;
                text-align: right;
            }

            .index-status.error {
                color: #9c2f14;
                font-weight: 700;
            }

            .rebuild-button {
                flex: 0 0 auto;
                display: grid;
                place-items: center;
                width: 44px;
                height: 44px;
                padding: 0;
                border: 1px solid #cfc8ba;
                border-radius: 9px;
                background: #fff;
                color: #57544e;
                cursor: pointer;
                transition:
                    border-color 120ms ease,
                    background 120ms ease,
                    color 120ms ease,
                    box-shadow 120ms ease;
            }

            .rebuild-button:hover:not(:disabled) {
                border-color: var(--accent);
                background: var(--accent-soft);
                color: var(--accent);
            }

            .rebuild-button:focus-visible {
                border-color: var(--focus);
                box-shadow: 0 0 0 3px rgba(156, 97, 20, 0.18);
                outline: none;
            }

            .rebuild-button svg {
                width: 21px;
                height: 21px;
                stroke-width: 2.15;
            }

            .rebuild-button:disabled {
                cursor: wait;
                opacity: 0.65;
            }

            .rebuild-button:disabled svg {
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .course-nav,
            .category-nav {
                display: flex;
                gap: 8px;
                padding: 12px 16px;
                overflow-x: auto;
                border-bottom: 1px solid var(--line);
                background: #fff;
                scrollbar-width: thin;
            }

            .course-nav {
                padding-bottom: 10px;
                background: #f8f6f0;
            }

            .course-nav button,
            .category-nav button {
                flex: 0 0 auto;
                border: 1px solid var(--line);
                border-radius: 999px;
                background: #fff;
                color: var(--muted);
                padding: 8px 11px;
                font-size: 0.86rem;
                cursor: pointer;
            }

            .course-nav button {
                color: var(--ink);
                font-weight: 700;
            }

            .course-nav button:hover,
            .course-nav button.active,
            .category-nav button:hover,
            .category-nav button.active {
                border-color: var(--accent);
                background: var(--accent-soft);
                color: var(--accent);
            }

            .document-list {
                flex: 1;
                min-height: 0;
                overflow: auto;
                padding: 14px 16px 28px;
            }

            .group {
                margin-bottom: 18px;
            }

            .group.hidden {
                display: none;
            }

            .group.favorite-group .group-heading h2 {
                color: var(--lu-bronze);
            }

            .group-heading {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin: 10px 4px 8px;
            }

            .group-heading h2 {
                margin: 0;
                font-size: 0.92rem;
                line-height: 1.2;
                text-transform: uppercase;
                color: var(--muted);
            }

            .count {
                color: var(--muted);
                font-size: 0.8rem;
            }

            .doc-result {
                position: relative;
            }

            .doc-button {
                display: grid;
                grid-template-columns: 38px minmax(0, 1fr);
                gap: 10px;
                width: 100%;
                min-height: 66px;
                margin: 7px 0;
                padding: 10px 46px 10px 10px;
                border: 1px solid var(--line);
                border-radius: 4px;
                background: #fff;
                color: var(--ink);
                text-align: left;
                cursor: pointer;
            }

            .favorite-button {
                position: absolute;
                top: 14px;
                right: 10px;
                display: grid;
                place-items: center;
                width: 30px;
                height: 30px;
                border: 1px solid transparent;
                border-radius: 999px;
                background: transparent;
                color: var(--muted);
                font: inherit;
                cursor: pointer;
                padding: 0px;
            }

            .favorite-button:hover,
            .favorite-button.active {
                border-color: #e1c48e;
                background: #fff7e8;
                color: var(--lu-bronze);
            }

            .favorite-button svg {
                width: 18px;
                height: 18px;
                fill: none;
                stroke: currentColor;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .favorite-button.active svg {
                fill: currentColor;
            }

            .doc-button:hover,
            .doc-button.active {
                border-color: var(--accent);
                background: var(--accent-soft);
                box-shadow: inset 4px 0 0 var(--lu-bronze);
            }

            .doc-icon {
                display: grid;
                place-items: center;
                width: 38px;
                height: 44px;
                border-radius: 4px;
                background: #f2e4d1;
                color: var(--lu-bronze);
                font-weight: 700;
                font-size: 0.72rem;
            }

            .doc-title {
                display: block;
                overflow-wrap: anywhere;
                font-weight: 700;
                line-height: 1.25;
            }

            .doc-meta {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                margin-top: 6px;
                color: var(--muted);
                font-size: 0.82rem;
                line-height: 1.2;
            }

            .doc-hit-list {
                display: grid;
                gap: 5px;
                margin: 4px 0 10px 48px;
            }

            .doc-hit-summary {
                color: var(--muted);
                font-size: 0.78rem;
                font-weight: 700;
                line-height: 1.2;
            }

            .doc-hit {
                display: grid;
                grid-template-columns: auto minmax(0, 1fr);
                gap: 8px;
                width: 100%;
                padding: 7px 9px;
                border: 1px solid #e6ded0;
                border-radius: 4px;
                background: #fff;
                color: #263340;
                font: inherit;
                text-align: left;
                cursor: pointer;
            }

            .doc-hit:hover,
            .doc-hit.active {
                border-color: var(--lu-bronze);
                background: #fbf4ea;
            }

            .doc-hit mark {
                padding: 0 2px;
                background: #f3ddbd;
                color: var(--ink);
            }

            .text-viewer mark.viewer-match {
                padding: 1px 3px;
                border-radius: 3px;
                background: #f3ddbd;
                color: var(--ink);
            }

            .text-viewer mark.viewer-match.active {
                outline: 2px solid var(--lu-bronze);
                outline-offset: 1px;
            }

            .doc-hit-page {
                color: var(--lu-bronze);
                font-size: 0.78rem;
                font-weight: 700;
                white-space: nowrap;
            }

            .doc-hit-excerpt {
                min-width: 0;
                color: var(--muted);
                font-size: 0.82rem;
                line-height: 1.35;
                overflow-wrap: anywhere;
            }

            .viewer {
                display: flex;
                flex-direction: column;
                min-width: 0;
                height: 100vh;
                min-height: 0;
                overflow: hidden;
                background: #fff;
            }

            .viewer-bar {
                position: relative;
                z-index: 5;
                flex: 0 0 auto;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 18px;
                min-height: 72px;
                padding: 14px 20px;
                border-bottom: 1px solid var(--line);
                background: #fff;
                box-shadow: inset 0 -3px 0 var(--lu-bronze);
            }

            .viewer-title {
                min-width: 0;
            }

            .viewer-title h2 {
                margin: 0 0 4px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-size: 1.1rem;
                line-height: 1.25;
            }

            .viewer-title p {
                margin: 0;
                color: var(--muted);
                font-size: 0.88rem;
                overflow-wrap: anywhere;
            }

            .viewer-actions {
                flex: 0 0 auto;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .open-link,
            .split-button {
                flex: 0 0 auto;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                min-height: 40px;
                padding: 9px 13px;
                border: 0;
                border-radius: 8px;
                background: var(--lu-bronze);
                color: #fff;
                font: inherit;
                font-weight: 700;
                font-size: 0.9rem;
                text-decoration: none;
                cursor: pointer;
            }

            .split-button {
                border: 1px solid var(--line);
                background: #fff;
                color: var(--accent);
            }

            .split-button.active {
                border-color: var(--accent);
                background: var(--accent-soft);
            }

            .open-link svg {
                width: 17px;
                height: 17px;
            }

            .pdf-stage {
                position: relative;
                z-index: 1;
                flex: 1 1 auto;
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                gap: 14px;
                min-height: 0;
                overflow: hidden;
                padding: 14px;
                background: #faf9f5;
            }

            .pdf-stage.split {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .view-panel {
                display: flex;
                flex-direction: column;
                min-width: 0;
                min-height: 0;
                overflow: hidden;
            }

            .view-panel[data-view-id="2"] {
                display: none;
            }

            .pdf-stage.split .view-panel[data-view-id="2"] {
                display: flex;
            }

            .view-panel-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                width: 100%;
                border: 1px solid var(--line);
                border-bottom: 0;
                border-radius: 4px 4px 0 0;
                background: #fff;
                color: var(--ink);
            }

            .view-panel-select {
                flex: 1 1 auto;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                min-width: 0;
                min-height: 52px;
                padding: 10px 12px;
                border: 0;
                background: transparent;
                color: inherit;
                font: inherit;
                text-align: left;
                cursor: pointer;
            }

            .view-panel.active .view-panel-bar {
                border-color: var(--accent);
                background: var(--accent-soft);
                box-shadow: inset 4px 0 0 var(--lu-bronze);
            }

            .clear-view-button {
                flex: 0 0 auto;
                display: grid;
                place-items: center;
                width: 34px;
                height: 34px;
                margin-right: 8px;
                border: 1px solid transparent;
                border-radius: 999px;
                background: transparent;
                color: var(--muted);
                cursor: pointer;
            }

            .clear-view-button:hover:not(:disabled),
            .clear-view-button:focus-visible {
                border-color: var(--line);
                background: #fff;
                color: var(--lu-bronze);
            }

            .clear-view-button:disabled {
                opacity: 0.35;
                cursor: default;
            }

            .clear-view-button svg {
                width: 18px;
                height: 18px;
                fill: none;
                stroke: currentColor;
                stroke-width: 2;
                stroke-linecap: round;
            }

            .view-panel-label {
                flex: 0 0 auto;
                color: var(--lu-bronze);
                font-weight: 700;
                font-size: 0.82rem;
            }

            .view-panel-title {
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                color: var(--muted);
                font-size: 0.86rem;
            }

            .view-panel-body {
                position: relative;
                flex: 1 1 auto;
                display: flex;
                min-height: 0;
                overflow: hidden;
            }

            .pdf-frame {
                display: block;
                flex: 1 1 auto;
                width: 100%;
                height: 100%;
                min-height: 0;
                border: 1px solid var(--line);
                border-radius: 0 0 4px 4px;
                background: #fff;
                box-shadow: var(--shadow);
            }

            .text-viewer {
                flex: 1 1 auto;
                width: 100%;
                height: 100%;
                min-height: 0;
                overflow: auto;
                border: 1px solid var(--line);
                border-radius: 0 0 4px 4px;
                background: #fff;
                box-shadow: var(--shadow);
                padding: 28px;
                color: var(--ink);
                font-size: 1rem;
                line-height: 1.6;
            }

            .text-viewer[hidden] {
                display: none;
            }

            .text-viewer pre {
                margin: 0;
                white-space: pre-wrap;
                overflow-wrap: anywhere;
                font: inherit;
            }

            .text-viewer h1,
            .text-viewer h2,
            .text-viewer h3 {
                margin: 1.1em 0 0.45em;
                line-height: 1.25;
            }

            .text-viewer h1:first-child,
            .text-viewer h2:first-child,
            .text-viewer h3:first-child {
                margin-top: 0;
            }

            .text-viewer p,
            .text-viewer ul,
            .text-viewer ol,
            .text-viewer pre {
                margin: 0 0 0.9em;
            }

            .text-viewer code {
                padding: 0.1em 0.25em;
                border-radius: 4px;
                background: #f2efe6;
            }

            .text-viewer blockquote {
                margin: 0 0 0.9em;
                padding-left: 14px;
                border-left: 3px solid var(--lu-bronze);
                color: var(--muted);
            }

            .image-viewer {
                flex: 1 1 auto;
                width: 100%;
                height: 100%;
                min-height: 0;
                overflow: auto;
                border: 1px solid var(--line);
                border-radius: 0 0 4px 4px;
                background: #fff;
                box-shadow: var(--shadow);
                padding: 18px;
            }

            .image-viewer[hidden] {
                display: none;
            }

            .image-viewer img {
                display: block;
                max-width: 100%;
                max-height: 100%;
                width: auto;
                height: auto;
                margin: 0 auto;
                object-fit: contain;
            }

            .panel-empty {
                flex: 1 1 auto;
                display: none;
                place-items: center;
                min-height: 360px;
                border: 1px dashed var(--line);
                border-radius: 0 0 4px 4px;
                background: #fff;
                color: var(--muted);
                text-align: center;
                padding: 24px;
            }

            .panel-empty.visible {
                display: grid;
            }
            @media (max-width: 1180px) {
                .app {
                    grid-template-columns: minmax(310px, 380px) minmax(
                            420px,
                            1fr
                        );
                }
            }

            @media (max-width: 900px) {
                html,
                body {
                    height: auto;
                    overflow: auto;
                }

                .app {
                    display: flex;
                    flex-direction: column;
                    height: auto;
                    overflow: visible;
                }

                .sidebar {
                    order: 1;
                    height: auto;
                    min-height: auto;
                    overflow: visible;
                    border-right: 0;
                }

                .document-list {
                    max-height: 48vh;
                }

                .viewer {
                    order: 3;
                    height: auto;
                    min-height: 70vh;
                    overflow: visible;
                }

                .viewer-bar {
                    align-items: flex-start;
                    flex-direction: column;
                }

                .viewer-title h2 {
                    white-space: normal;
                }

                .viewer-actions {
                    width: 100%;
                    flex-direction: column;
                    align-items: stretch;
                }

                .open-link,
                .split-button {
                    width: 100%;
                    justify-content: center;
                }

                .pdf-stage {
                    flex: 0 0 auto;
                    height: 70vh;
                    min-height: 420px;
                }

                .pdf-frame {
                    height: 100%;
                    min-height: 0;
                }

                .pdf-stage.split {
                    grid-template-columns: minmax(0, 1fr);
                    height: 120vh;
                }
            }
        </style>
    </head>
    <body>
        <main id="portal-view" class="app">
            <aside class="sidebar" aria-label="Dokumentlista">
                <header class="header">
                    <h1>Dokumentsök</h1>
                    <div class="search-row">
                        <label class="search-wrap" for="search">
                            <svg
                                class="search-icon"
                                aria-hidden="true"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <circle cx="11" cy="11" r="7"></circle>
                                <path d="m20 20-3.5-3.5"></path>
                            </svg>
                            <input
                                id="search"
                                type="search"
                                placeholder="Sök ord i dokument..."
                                autocomplete="off"
                            />
                        </label>
                        <button
                            id="rebuild-index"
                            class="rebuild-button"
                            type="button"
                            aria-label="Uppdatera index"
                            title="Uppdatera index"
                        >
                            <svg
                                aria-hidden="true"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2.15"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                style="
                                    width: 25px;
                                    height: 25px;
                                    padding-top: 1px;
                                "
                            >
                                <path d="M19.5 8.5A7.5 7.5 0 1 0 20 14"></path>
                                <path d="M19.5 4.5v4h-4"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="stats">
                        <span id="result-count">Laddar...</span>
                        <span id="index-status" class="index-status"></span>
                    </div>
                </header>

                <nav class="course-nav" aria-label="Kurser"></nav>
                <nav class="category-nav" aria-label="Kategorier"></nav>

                <section
                    id="document-list"
                    class="document-list"
                    aria-live="polite"
                ></section>
            </aside>

            <section class="viewer" aria-label="Dokumentförhandsvisning">
                <div class="viewer-bar">
                    <div class="viewer-title">
                        <h2 id="viewer-title">Välj ett dokument</h2>
                        <p id="viewer-path">Förhandsvisningen visas här.</p>
                    </div>
                    <div class="viewer-actions">
                        <a
                            id="open-link"
                            class="open-link"
                            href="#"
                            target="_blank"
                            rel="noopener"
                        >
                            <span>Öppna i ny flik</span>
                            <svg
                                aria-hidden="true"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path d="M15 3h6v6"></path>
                                <path d="M10 14 21 3"></path>
                                <path
                                    d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"
                                ></path>
                            </svg>
                        </a>
                        <button
                            id="split-toggle"
                            class="split-button"
                            type="button"
                            aria-pressed="false"
                        >
                            Split view
                        </button>
                    </div>
                </div>
                <div id="viewer-stage" class="pdf-stage">
                    <section class="view-panel active" data-view-id="1">
                        <div class="view-panel-bar">
                            <button class="view-panel-select" type="button">
                                <span class="view-panel-label">Vy 1</span>
                                <span class="view-panel-title"
                                    >Välj ett dokument</span
                                >
                            </button>
                            <button
                                class="clear-view-button"
                                type="button"
                                aria-label="Töm vy 1"
                                title="Töm vy"
                            >
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M18 6 6 18"></path>
                                    <path d="m6 6 12 12"></path>
                                </svg>
                            </button>
                        </div>
                        <div class="view-panel-body">
                            <div class="panel-empty visible">
                                Inga dokument matchar sökningen.
                            </div>
                            <iframe
                                class="pdf-frame"
                                title="Förhandsvisning vy 1"
                                width="100%"
                                height="100%"
                                hidden
                            ></iframe>
                            <article
                                class="text-viewer"
                                aria-label="Textförhandsvisning vy 1"
                                hidden
                            ></article>

                                width="100%"
                                height="100%"
